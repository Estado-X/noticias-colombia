<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi portada · Colombia</title>
<style>
/* Estado X · carril editorial (marfil) con la banda de color del banner. */
:root {
  --oliva: #73704f; --oliva-700: #565442; --oliva-100: #d9d6c4;
  --marfil: #f2ebdc; --marfil-050: #faf6ec; --marfil-200: #e7decb;
  --vino: #603338; --tinta: #2a231f; --muted: #6e6456;
  --cadmio: #ffff55; --cobre: #9c5635; --arena: #dfc6b1; --negro-calido: #0d090a;
  --borde: #e7decb; --card: #ffffff;
  --display: "Neue Haas Grotesk Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sans: "Neue Haas Grotesk Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --acento: "Playfair Display", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--marfil); color: var(--tinta); font: 16px/1.5 var(--sans); }
a { color: inherit; text-underline-offset: 3px; }
a:focus-visible { outline: 3px solid #b2b0bc; outline-offset: 2px; border-radius: 4px; }
.contenedor { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
.banda { background: linear-gradient(115deg, var(--negro-calido) 0%, #4a1b1f 34%, #5d2523 52%, var(--cobre) 80%, var(--arena) 100%); color: var(--marfil); }
.banda .contenedor { padding-block: 32px 28px; display: grid; gap: 12px; }
.kicker { margin: 0; font: 600 12px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--cadmio); }
h1 { margin: 0; font: 700 clamp(32px, 5.5vw, 56px)/1.02 var(--display); letter-spacing: -.02em; }
h1 em { font-family: var(--acento); font-style: italic; font-weight: 400; color: var(--cadmio); }
.perfil { margin: 0; color: rgba(242,235,220,.82); font-size: 15px; }
.resumen { margin: 6px 0 0; padding: 16px 20px; list-style: none; display: grid; gap: 8px; background: rgba(13,9,10,.42); border: 1px solid rgba(242,235,220,.18); border-radius: 16px; }
.resumen li { padding-left: 18px; position: relative; font-size: 16px; }
.resumen li::before { content: ""; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: var(--cadmio); }
.columnas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; padding-block: 28px 12px; align-items: start; }
.columna { background: var(--card); border: 1px solid var(--borde); border-radius: 16px; padding: 18px 18px 8px; box-shadow: 0 1px 2px rgba(42,35,31,.06), 0 4px 14px rgba(42,35,31,.05); }
.columna h2 { margin: 0 0 4px; font: 700 20px/1.2 var(--display); color: var(--vino); }
.nota { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.noticias { list-style: none; margin: 8px 0 0; padding: 0; }
.noticia { padding: 12px 0; border-top: 1px solid var(--marfil-200); }
.noticia:first-child { border-top: 0; }
.noticia a.tit { display: block; font: 600 16px/1.35 var(--sans); text-decoration: none; }
.noticia a.tit:hover { text-decoration: underline; }
.meta { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--oliva-700); font-weight: 600; }
.porque { margin: 6px 0 0; font-size: 14px; }
.vacio { margin: 10px 0 14px; color: var(--muted); font-size: 14px; }
footer { padding-block: 8px 32px; font-size: 13px; color: var(--muted); }
footer em { font-family: var(--acento); }
@media (max-width: 480px) { .banda .contenedor { padding-block: 24px 22px; } .columnas { gap: 14px; } }
</style>
</head>
<body>
<header class="banda">
  <div class="contenedor">
    <p class="kicker" id="fecha">Mi portada</p>
    <h1>Lo que pasó hoy en <em>Colombia</em></h1>
    <p class="perfil" id="perfil"></p>
    <ul class="resumen" id="resumen" aria-label="Resumen del día"></ul>
  </div>
</header>
<main class="contenedor">
  <div class="columnas" id="columnas"></div>
</main>
<footer class="contenedor">
  Titulares y enlaces de cada medio; el texto de «por qué importa» es un resumen propio. No reemplaza leer la noticia completa.<br>
  Hecho con la skill <b>portada-colombia</b> de <em>Estado X</em> · estadox.com
</footer>

<!-- Claude reemplaza solo el contenido de este bloque. -->
<script id="datos" type="application/json">
{
  "fecha": "dd/mm/aaaa",
  "hora": "",
  "perfil": "Temas · Región",
  "resumen": ["Aquí va la primera línea del resumen.", "Aquí la segunda.", "Aquí la tercera."],
  "columnas": [
    {"titulo": "Tema", "nota": "", "noticias": []}
  ]
}
</script>
<script>
(function () {
  var datos = {};
  try { datos = JSON.parse(document.getElementById("datos").textContent); } catch (e) { datos = {}; }
  function el(tag, cls, texto) { var n = document.createElement(tag); if (cls) n.className = cls; if (texto != null) n.textContent = texto; return n; }
  function urlSegura(u) { return /^https?:\/\//i.test(u || "") ? u : null; }

  document.getElementById("fecha").textContent = "Mi portada · " + (datos.fecha || "") + (datos.hora ? ", " + datos.hora : "");
  document.getElementById("perfil").textContent = datos.perfil || "";
  var res = document.getElementById("resumen");
  (datos.resumen || []).forEach(function (l) { res.appendChild(el("li", null, l)); });
  if (!res.children.length) res.hidden = true;

  var cont = document.getElementById("columnas");
  (datos.columnas || []).forEach(function (c) {
    var sec = el("section", "columna");
    sec.appendChild(el("h2", null, c.titulo || ""));
    if (c.nota) sec.appendChild(el("p", "nota", c.nota));
    var lista = el("ul", "noticias");
    (c.noticias || []).forEach(function (n) {
      var u = urlSegura(n.url);
      var li = el("li", "noticia");
      var a = el(u ? "a" : "span", "tit", n.titular || "");
      if (u) { a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      li.appendChild(a);
      var meta = el("p", "meta");
      meta.appendChild(el("b", null, n.medio || ""));
      if (n.fecha) meta.appendChild(document.createTextNode(" · " + n.fecha));
      li.appendChild(meta);
      if (n.porque) li.appendChild(el("p", "porque", n.porque));
      lista.appendChild(li);
    });
    if (lista.children.length) sec.appendChild(lista);
    else sec.appendChild(el("p", "vacio", "Sin noticias nuevas sobre este tema hoy."));
    cont.appendChild(sec);
  });
})();
</script>
</body>
</html>
